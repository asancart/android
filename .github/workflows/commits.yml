# Commit policy (T0.3): every commit a push or PR brings is signed (GitHub-verified) and carries
# no AI attribution; a PR's title and body carry none either. See .github/scripts/commit_policy.py.
name: Commit policy

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commits-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Signed commits, no AI attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Self-test
        run: python3 -I -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/commit_policy.py
