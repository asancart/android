name: Android

# Every push runs the gates (T0.3). Pull requests from this repo are already covered by their
# push run, so the pull_request run only builds PRs from forks.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, debug APK
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also validates gradle-wrapper.jar against the official checksums.
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, unit tests, debug APK
        run: ./gradlew --continue --stacktrace :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease

      # The debug APK is signed with the runner's generated debug key. Release signing is T4.5.
      - name: Verify APK signature
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk"

      # REQ-APP-042 (DEC-035): the application ID is fixed from the first published APK.
      - name: Check app identity
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          check() {
            badging=$("$aapt2" dump badging "$1")
            pkg=$(echo "$badging" | sed -n -E "s/^package: name='([^']*)'.*/\1/p")
            # build-tools 36 prints minSdkVersion:'24'; older ones sdkVersion:'24'.
            min=$(echo "$badging" | sed -n -E "s/^(minSdkVersion|sdkVersion):'([0-9]+)'.*/\2/p" | head -1)
            echo "$1: package=$pkg minSdk=$min"
            [ "$pkg" = "$2" ] && [ "$min" = "24" ] || { echo "expected package $2 and minSdk 24"; return 1; }
          }
          check app/build/outputs/apk/debug/app-debug.apk io.github.asancart.android.debug
          check app/build/outputs/apk/release/app-release-unsigned.apk io.github.asancart.android

      # REQ-APP-041: no manifest entry may reach Play Services or Firebase (e.g. emoji2's font
      # initializer). Checks the packaged debug and release manifests from the APKs.
      - name: Check manifests for Play Services
        run: |
          mkdir -p app/build/reports/manifests
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$aapt2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk > app/build/reports/manifests/debug-apk.txt
          "$aapt2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/release/app-release-unsigned.apk > app/build/reports/manifests/release-apk.txt
          scripts/check-manifest-no-gms.sh app/build/reports/manifests/debug-apk.txt app/build/reports/manifests/release-apk.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: asancart-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Unsigned (release signing is T4.5), so not installable; uploaded for identity and manifest checks.
      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v7
        with:
          name: asancart-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/outputs/screenshots/
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore

  # T4.2: the Parser Template fixtures, the SMS receiver and the inbox re-scan on real Android
  # (ICU regex, Telephony framework). API 24 is the app's minSdk.
  instrumented:
    name: Instrumented tests (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [24, 34]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          # The SMS goes to the emulator's own SMS app, which stores it in the inbox for the re-scan test.
          script: |
            adb emu sms send 9876543 Asancart-inbox-check-4821
            sleep 20
            ./gradlew --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.inboxSender=9876543 -Pandroid.testInstrumentationRunnerArguments.inboxText=Asancart-inbox-check-4821

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
