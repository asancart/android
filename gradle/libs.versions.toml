[versions]
# AGP 9.5 needs Gradle >= 9.6, supports compileSdk up to 37, runs on JDK 17+.
agp = "9.5.1"
# Built-in Kotlin (AGP 9). Declaring the Kotlin JVM plugin in the root raises the KGP that AGP brings to this version.
kotlin = "2.4.21"
coroutines = "1.11.0"
# JsonElement API only (no serialization compiler plugin): Parser Template bodies and fixtures.
serializationJson = "1.13.0"
composeBom = "2026.09.00"
activity = "1.13.0"
# lifecycle 2.11 compiles against API 37 and needs AGP >= 9.2.
lifecycle = "2.11.0"
# The manifest names its InitializationProvider (REQ-APP-041 emoji2 removal), so it is a direct dependency.
startup = "1.2.0"
# java.time and other JDK APIs on API 24-25 (core uses java.time).
desugarJdkLibs = "2.1.5"
junit = "4.13.2"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"
robolectric = "4.17"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startup" }

desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
